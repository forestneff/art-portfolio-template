        }

            color: var(--text-color);

        }

        h2,
        h3,
        h4,
        .serif {
            font-family: 'Playfair Display', serif;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: #D1D5DB;
            border-radius: 3px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        /* Video Background */
        .video-bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;

                        {config.layout.map(s => {
                            if (!s.visible) return null;
                            if (s.id === 'statement') return <Sections.statement key={s.id} config={config} />;
                            if (s.id === 'featured') return <Sections.featured key={s.id} config={config} items={items} openModal={i => setModals({ ...modals, canvas: true, canvasItem: i })} />;
                            if (s.id === 'exhibitions') return <Sections.exhibitions key={s.id} />;
                            if (s.id === 'press') return <Sections.press key={s.id} />;
                            if (s.id === 'archive') return <Sections.archive key={s.id} config={config} items={items} openModal={i => setModals({ ...modals, canvas: true, canvasItem: i })} />;
                            if (s.id === 'bio') return <Sections.bio key={s.id} config={config} />;
                            if (s.id === 'contact') return <Sections.contact key={s.id} config={config} onLogin={handleLogin} />;
                            return null;
                        })}
                    </main>
                    <CanvasModal item={modals.canvasItem} isOpen={modals.canvas} onClose={() => setModals({ ...modals, canvas: false, canvasItem: null })} config={config} />
                    <AdminDashboard isOpen={modals.admin} onClose={() => setModals({ ...modals, admin: false })} config={config} items={items} onUpdateConfig={handleUpdateConfig} onAddItem={handleAddItem} onUpdateItem={handleUpdateItem} onDeleteItem={handleDeleteItem} onLogout={() => setModals({ ...modals, admin: false })} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
